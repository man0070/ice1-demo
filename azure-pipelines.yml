trigger:
- main

variables:
  azureSubscription: 'sc-azure-ice1'          # Service connection name in Azure DevOps
  acrName: 'acrnoor'                          # ACR name (without .azurecr.io)
  imageName: 'ice1-demo'                      # Container image name
  appName: 'asp-ice1'                         # App Service name
  resourceGroup: 'ice'                        # Resource group name
  tag: '$(Build.BuildId)'                     # Unique build ID tag

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: BuildAndPush
  displayName: Build and Push to ACR
  jobs:
  - job: Build
    steps:
    - task: Docker@2
      displayName: Build and push Docker image to ACR
      inputs:
        containerRegistry: '$(azureSubscription)'          # Azure service connection
        repository: '$(acrName).azurecr.io/$(imageName)'
        command: 'buildAndPush'
        Dockerfile: '**/Dockerfile'
        tags: |
          $(tag)

- stage: Deploy
  displayName: Deploy to Azure Web App
  dependsOn: BuildAndPush
  jobs:
  - deployment: DeployWebApp
    displayName: Deploy container to Web App
    environment: 'production'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureWebAppContainer@1
            displayName: Deploy image to Web App
            inputs:
              azureSubscription: '$(azureSubscription)'
              appName: '$(appName)'
              imageName: '$(acrName).azurecr.io/$(imageName):$(tag)'

